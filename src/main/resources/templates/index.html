<!DOCTYPE html>
<!--integrando la tecnologia de thymeleaf-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Sistema de contactos</title>
</head>
<body>

    <!-- Div parra desplegar la barra de navegacion -->
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Sistema de contactos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li  class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/agregar">Agregar Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <!-- Div para desplegar la tabla -->
    <div class="container">
        <div class="container text-center" style="margin: 30px;">
            <h3>Sistema de contactos</h3>
        </div>
        <div class="container">
            <table class="table table-hover table-striped align-middle table-bordered">
                <thead class="table-dark text-center">
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Email</th>
                    <th scope="col">Telefono</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contacto: ${contactos}">
                    <th th:text="${contacto.getIdContacto()}" scope="row"></th>
                    <td th:text="${contacto.getNombre() + ' ' + contacto.getApellido()}"></td>
                    <td th:text="${contacto.getEmail()}"></td>
                    <td th:text="${contacto.getTelefono()}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>
</html>
